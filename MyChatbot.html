<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>OFPPT — Chatbot Inscriptions</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet"/>
<style>
  :root {
    --green: #00a86b;
    --green-dark: #007a4d;
    --green-light: #e6f7f1;
    --red: #c0392b;
    --red-light: #fdf0ee;
    --bg: #f4f6f8;
    --white: #ffffff;
    --gray: #6b7280;
    --gray-light: #e5e7eb;
    --text: #1a1a2e;
    --shadow: 0 4px 24px rgba(0,0,0,0.08);
    --radius: 18px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Sora', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
  }

  /* HEADER */
  header {
    width: 100%;
    background: linear-gradient(135deg, #007a4d 0%, #00c17a 100%);
    padding: 18px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    box-shadow: 0 2px 12px rgba(0,120,70,0.25);
  }
  .logo-circle {
    width: 52px; height: 52px;
    background: white;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 700; color: var(--green-dark);
    flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }
  .header-text h1 {
    color: white; font-size: 1.05rem; font-weight: 700; line-height: 1.2;
  }
  .header-text p {
    color: rgba(255,255,255,0.82); font-size: 0.75rem; margin-top: 2px;
  }

  /* LANG SELECTOR */
  .lang-bar {
    width: 100%; max-width: 700px;
    display: flex; gap: 8px; padding: 14px 16px 0;
    justify-content: flex-start;
  }
  .lang-btn {
    padding: 6px 16px; border-radius: 20px; border: 2px solid var(--green);
    background: white; color: var(--green-dark);
    font-family: 'Tajawal', 'Sora', sans-serif;
    font-size: 0.82rem; font-weight: 600;
    cursor: pointer; transition: all 0.2s;
  }
  .lang-btn.active {
    background: var(--green); color: white;
  }
  .lang-btn:hover { background: var(--green); color: white; }

  /* CHAT CONTAINER */
  .chat-wrap {
    width: 100%; max-width: 700px;
    flex: 1; display: flex; flex-direction: column;
    padding: 14px 16px 0;
  }

  .messages {
    flex: 1; overflow-y: auto;
    display: flex; flex-direction: column; gap: 12px;
    padding-bottom: 12px;
    max-height: 62vh;
    scroll-behavior: smooth;
  }

  /* BUBBLES */
  .bubble {
    max-width: 88%; padding: 13px 17px;
    border-radius: var(--radius); line-height: 1.65;
    font-size: 0.9rem; animation: fadeUp 0.3s ease;
    font-family: 'Tajawal', 'Sora', sans-serif;
  }
  @keyframes fadeUp {
    from { opacity:0; transform: translateY(10px); }
    to   { opacity:1; transform: translateY(0); }
  }
  .bubble.bot {
    background: white; color: var(--text);
    border-bottom-left-radius: 4px;
    box-shadow: var(--shadow);
    align-self: flex-start;
  }
  .bubble.user {
    background: var(--green); color: white;
    border-bottom-right-radius: 4px;
    align-self: flex-end;
    box-shadow: 0 2px 10px rgba(0,168,107,0.3);
  }
  .bubble.bot strong { color: var(--green-dark); }
  .bubble.bot ul { padding-left: 18px; margin-top: 6px; }
  .bubble.bot li { margin-bottom: 4px; }
  .bubble.bot a { color: var(--green-dark); text-decoration: underline; }

  /* QUICK REPLIES */
  .quick-replies {
    display: flex; flex-wrap: wrap; gap: 8px;
    margin-top: 4px; align-self: flex-start;
    max-width: 94%;
    animation: fadeUp 0.35s ease;
  }
  .qr-btn {
    padding: 7px 14px; border-radius: 20px;
    border: 2px solid var(--green); background: white;
    color: var(--green-dark); font-size: 0.8rem; font-weight: 600;
    cursor: pointer; font-family: 'Tajawal', 'Sora', sans-serif;
    transition: all 0.18s;
  }
  .qr-btn:hover { background: var(--green); color: white; }

  /* INPUT BAR */
  .input-bar {
    width: 100%; max-width: 700px;
    display: flex; gap: 10px;
    padding: 12px 16px 20px;
    background: var(--bg);
    position: sticky; bottom: 0;
  }
  .input-bar input {
    flex: 1; padding: 12px 18px;
    border-radius: 30px; border: 2px solid var(--gray-light);
    font-family: 'Tajawal', 'Sora', sans-serif;
    font-size: 0.9rem; outline: none;
    background: white; color: var(--text);
    transition: border 0.2s;
  }
  .input-bar input:focus { border-color: var(--green); }
  .input-bar button {
    width: 48px; height: 48px; border-radius: 50%;
    background: var(--green); border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 10px rgba(0,168,107,0.35);
    transition: background 0.2s;
  }
  .input-bar button:hover { background: var(--green-dark); }
  .input-bar button svg { width: 20px; height: 20px; fill: white; }

  /* TYPING */
  .typing { display: flex; gap: 5px; align-items: center; padding: 10px 14px; }
  .typing span {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--green); animation: bounce 1s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%,80%,100% { transform: scale(0.7); opacity:0.5; }
    40% { transform: scale(1.1); opacity:1; }
  }

  /* RTL support for Darija/Tamazight */
  .rtl { direction: rtl; text-align: right; }
  .tifinagh { font-size: 1.05rem; }
</style>
</head>

function setLang(l) {
  lang = l;
  document.querySelectorAll('.lang-btn').forEach((b,i) => {
    b.classList.toggle('active', ['fr','da','tz'][i] === l);
  });
  document.getElementById('userInput').placeholder = T[l].placeholder;
  clearChat();
  initChat();
}

// ─── CHAT ENGINE ────────────────────────────────────────────────────────────
const messagesEl = document.getElementById('messages');

function clearChat() { messagesEl.innerHTML = ''; }

function addBubble(text, sender='bot') {
  const div = document.createElement('div');
  div.className = `bubble ${sender}`;
  if (lang === 'da') div.classList.add('rtl');
  if (lang === 'tz') div.classList.add('tifinagh');
  div.innerHTML = text.replace(/\n/g,'<br/>');
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

function addQuickReplies(labels) {
  const div = document.createElement('div');
  div.className = 'quick-replies';
  if (lang === 'da') div.style.direction = 'rtl';
  labels.forEach(label => {
    const btn = document.createElement('button');
    btn.className = 'qr-btn';
    btn.textContent = label;
    btn.onclick = () => { handleQR(label); };
    div.appendChild(btn);
  });
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function showTyping() {
  const div = document.createElement('div');
  div.className = 'bubble bot'; div.id = 'typing';
  div.innerHTML = `<div class="typing"><span></span><span></span><span></span></div>`;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}
function removeTyping() {
  const t = document.getElementById('typing');
  if(t) t.remove();
}

// ─── KEYWORD MATCHING ────────────────────────────────────────────────────────
function detectTopic(text) {
  const t = text.toLowerCase();
  if (/fili|branch|شعب|spécial|تخصص|ⵜⵉⵙⵍⴳ|disponib|available|programme|cursus/.test(t)) return 'filieres';
  if (/condit|inscri|تسجيل|شرط|ⵜⵉⵎⵙⵙⵉⵜ|requir|eligib|accès|acceder|niveau|بكالور|باك/.test(t)) return 'conditions';
  if (/doc|pièc|دossier|ملف|وثيق|ⵜⵉⵡⵡⵓⵔⵉ|papier|cin|photo|certificat|relevé/.test(t)) return 'documents';
  if (/date|délai|آجال|وقت|ⵡⴰⵙⵙ|limit|echéanc|juillet|07|27/.test(t)) return 'dates';
  if (/frais|prix|cout|درهم|رسوم|ⵉⵙⵎⴷ|bourse|منحة|tarif|800|950|50/.test(t)) return 'frais';
  if (/comment|inscri|كيفاش|كيف|ⵎⴰⵎⴽ|myway|plateforme|online|ligne|procédure/.test(t)) return 'inscription';
  if (/dur[eé]e|ans|année|مدة|سنة|سنتين|ⵣⵎⵣ|ⵙⵓⴷⵓ|formation|combien de temps/.test(t)) return 'duree';
  if (/local|adresse|où|lieu|emplacement|plan|موقع|عنوان|مكان|ⴰⵙⵜⴰⵢ|mozart|rabat|marjane/.test(t)) return 'localisation';
  if (/contact|rendez|تواصل|موعد|ⴰⵎⵢⴰⵡⴰⴷ|conseiller|orientation|téléphone/.test(t)) return 'contact';
  return null;
}

};

function handleQR(label) {
  addBubble(label, 'user');
  const topic = QR_MAP[lang][label];
  setTimeout(() => {
    const t = showTyping();
    setTimeout(() => {
      removeTyping();
      const resp = getResponse(topic);
      addBubble(resp || T[lang].fallback);
      addQuickReplies(T[lang].qr);
    }, 700);
  }, 100);
}

function sendMessage() {
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  addBubble(text, 'user');
  const t = showTyping();
  setTimeout(() => {
    removeTyping();
    const topic = detectTopic(text);
    const resp = topic ? getResponse(topic) : null;
    addBubble(resp || T[lang].fallback);
    addQuickReplies(T[lang].qr);
  }, 800);
}
